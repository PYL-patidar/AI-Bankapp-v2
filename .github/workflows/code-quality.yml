# code quality scan java -> Checkstyle
name: Code Quallity

on:
  workflow_call:

jobs:
  code-quality:

    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v4

      - uses: dbelyaev/action-checkstyle@v3
        with:
          checkstyle_version: 10.21.0 
          github_token: ${{ secrets.GITHUB_TOKEN }}