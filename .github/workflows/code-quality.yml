# code quality scan java -> Checkstyle
name: Code Quallity

on:
  workflow_call:

jobs:
  code-quality:

    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v5
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle
        run: mvn checkstyle:check || true 