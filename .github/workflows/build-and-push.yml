name: Build and push

on:
  workflow_call:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
              ${{vars.DOCKERHUB_USER}}/bankapp-v2:${{github.sha}}
              ${{vars.0DOCKERHUB_USER}}/bankapp-v2:${{github.ref_name}}
              ${{vars.DOCKERHUB_USER}}/bankapp-v2:latest
 