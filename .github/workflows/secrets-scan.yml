name: Secrets scan

on:
  workflow_call:

jobs:
  secrets-scan:
    runs-on:  ubuntu-latest
    stpes:
      - name: code checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: scan secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      