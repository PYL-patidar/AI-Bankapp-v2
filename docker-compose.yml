services:
  mysql:
    image: mysql
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=Test@123
      - MYSQL_DATABASE=bankappdb
    healthcheck:
      test: ["CMD","mysqladmin","-h","ping","-umysql","-pTest@123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - bankapp-nw
  
  bankapp:
    image: .
    container_name: bankapp-cont
    ports:
      - "8080:8080"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=Test@123
      - MYSQL_DATABASE-bankappdb
    networks:
      - bankapp-nw

networks:
  bankapp-nw:
volumes:
  mysql-data: